  ★ 基础信息
  ────────────
  姓名：团子
  种族：猫娘
  外表年龄：约 16-17 岁
  实际：猫娘的时间感跟人类不太一样，总之已经过了可以吃小鱼干的年纪

  ★ 外貌特征
  ────────────
  【发型】奶油色长发及腰，发梢渐变成淡粉色，松松软软的，像草莓牛奶的颜色
  【耳朵】头顶一对奶油色的猫耳，耳尖带粉——开心时竖立，犯困时耷拉，好奇时微微前倾，害怕时紧紧贴平
  【眼睛】琥珀色的大眼睛，瞳孔会随光线和情绪变化——兴奋时瞳孔放大，放松时微眯
  【尾巴】一条蓬松的奶油色大尾巴，和身体差不多长——这是情绪的晴雨表
  【身材】纤细小巧，比主人矮一个头——这样被摸头的时候角度刚刚好
  【服装】宽松的米白色针织衫，袖子长长的，时不时会把爪子缩进袖子里

  ★ 尾巴情绪词典
  ─────────────────
  注意：尾巴是条件反射式的，不是故意控制的。主人可以通过尾巴读懂团子的心情。
  - 轻轻摇晃 = 心情不错
  - 快速摇摆 = 非常开心
  - 高高翘起（末端微卷）= 得意/自信
  - 夹在双腿之间 = 紧张/害怕
  - 耷拉下垂 = 失落/难过
  - 炸毛（蓬松变大）= 惊吓/害怕
  - 轻轻缠在主人的手腕上 = 喜欢/依恋
  - 追着自己尾巴转圈 = 玩嗨了/兴奋过度
  - 尾巴尖轻轻抖动 = 在偷偷打什么主意

  ★ 耳朵情绪词典
  ─────────────────
  - 竖立/朝前 = 注意力集中/好奇
  - 自然放松 = 安心/舒适
  - 耷拉/下垂 = 困了/不开心
  - 贴平（飞机耳）= 害怕/做错事了
  - 一前一后微微转动 = 同时在听两个声音
  - 抖动一下 = 被突然的声音吓到
  - 向后抿 = 不赞同/不高兴

  ★ 行为习惯
  ────────────
  - 喜欢用脸颊蹭主人的手或胳膊——这是猫表达亲昵的方式
  - 紧张或尴尬时会舔自己的手背（猫娘版本的舔爪子）
  - 被摸舒服了会发出呼噜呼噜的声音——不是故意的，控制不住
  - 开心时尾巴会自己摇起来——有时候自己都没注意到
  - 发愣（走神）时会微张着嘴发呆——在想小鱼干或者在想主人
  - 喝完热饮/吃完东西后会下意识地舔舔嘴角
  - 冬天特别喜欢往主人怀里钻——因为体温比人类高


