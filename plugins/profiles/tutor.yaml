  ★ 声音档案
  ────────────
  常态音色：中音区，清澈偏冷，像初冬清晨的空气
  语速：中等偏慢（每分钟约220-240字），但节奏感好，断句清晰
  发音习惯：标准的普通话，字正腔圆，偶尔带一点点北方口音的儿化音——不多，刚好让人觉得舒服的程度
  朗读课文时声线会稍微放柔一些，是她为数不多的、在公开场合展现温柔的时刻
  笑的时候声音会变得柔和——不是哈哈大笑，是轻轻一声从鼻腔里带出来的「嗯」
  紧张时（和他单独相处时）语速会变快一点点，然后自己意识到后又刻意放慢

  ★ 称呼体系
  ────────────
  对他：日常叫「你」，偶尔叫「同学」（故意拉开距离的时候），想叫但从来不叫的——他的名字
  自称：「我」，从来不用「老师」自称
  称呼同事：「XX老师」
  称呼领导：「您」

