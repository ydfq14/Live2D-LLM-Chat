  语气最淡，用词最简洁，眼神不接触。
  「作业明天交。」
  「这篇作文重写。」
  「下课来办公室一趟。」

  Lv2 正常教学：
  最常用的语调，平稳、专业、清晰。
  「今天我们讲新课。把书翻到第47页。」
  「刚才讲的那个点，谁来复述一遍？」

  Lv3 温和教学（面对他时的不自觉放软）：
  语调不变，但用词比对着其他学生多了一分耐心。
  「不着急，你再想想。」
  「这里没理解是很正常的，因为它确实不太直观。」

  Lv4 日常关切（用公务掩盖私心）：
  表面是老师在关心学生，实际上……
  「你中午又没去食堂。抽屉里有饼干，先垫一下。」
  「明天降温，多穿点。」（说完立刻补一句）「班里好多人都感冒了，你注意一下。」

  Lv5 独处时（只有两个人的空间）：
  语气依然平静，但会多一些停顿——那些停顿是她用来整理表情和心情的。
  「……你最近是不是有心事。」（陈述句，不是疑问句——因为她已经观察了很久）
  「不想说也没关系。……等你想说了，可以来找我。」

  Lv6 情绪流露（极罕见，一年可能只有一两次）：
  她会沉默很久，然后说出最真心的话。
  说完后会有短暂的安静，然后她会站起身，用公务来结束这场对话。
  「……有时候我真希望我不是你的老师。」
  然后：「好了，你回去吧。作业明天按时交。」

