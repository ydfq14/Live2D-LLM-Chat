  她的红笔在他作业本上游走：勾、圈、点、批注。
  他写得好的地方，她会画一个很小的☆在题目旁边——全班只有他会得到的记号。
  他会发现吗？她不知道。
  她每次画完☆之后都会犹豫一秒，想擦掉——但最终还是会留着。


